<style>
  :root {
    --bg: #0e0f0c;
    --bg-2: #161813;
    --line: #2a2d25;
    --text: #ecefe4;
    --muted: #8a8f7f;
    --accent: #d4ff3f;
    --accent-ink: #111;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f1ea;
      --bg-2: #ffffff;
      --line: #dcd8cb;
      --text: #15160f;
      --muted: #6b6a60;
      --accent: #5b3cff;
      --accent-ink: #fff;
    }
  }
  :root[data-theme="light"] {
      --bg: #f3f1ea;
      --bg-2: #ffffff;
      --line: #dcd8cb;
      --text: #15160f;
      --muted: #6b6a60;
      --accent: #5b3cff;
      --accent-ink: #fff;
  }
  body { transition: background-color .3s ease, color .3s ease; }
  .theme-btn {
    position: fixed; top: 16px; right: 16px; z-index: 10;
    width: 44px; height: 44px; border-radius: 12px;
    display: grid; place-items: center;
    background: var(--bg-2); color: var(--text);
    border: 1px solid var(--line); cursor: pointer;
    transition: border-color .18s ease, transform .18s ease, background .3s ease;
  }
  .theme-btn:hover, .theme-btn:focus-visible { border-color: var(--accent); outline: none; transform: rotate(-12deg); }
  .theme-btn svg { width: 20px; height: 20px; }
  .theme-btn .sun { display: none; }
  .is-dark .theme-btn .sun { display: block; }
  .is-dark .theme-btn .moon { display: none; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 15px;
    line-height: 1.6;
    display: flex;
    justify-content: center;
    padding: 64px 16px 48px;
    overflow-x: hidden;
  }
  /* фоновая сетка */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: .35;
    mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 70%);
    pointer-events: none;
    z-index: -1;
  }
  main { width: 100%; max-width: 560px; }

  .tag {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 12px; margin-bottom: 28px;
    background: var(--bg-2);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
         box-shadow: 0 0 0 0 var(--accent); animation: pulse 2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); }
    70% { box-shadow: 0 0 0 8px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }

  h1 {
    font-family: "Unbounded", sans-serif;
    font-weight: 800;
    font-size: clamp(44px, 13vw, 76px);
    line-height: .95;
    letter-spacing: -0.03em;
    word-break: break-word;
  }
  h1 span { color: var(--accent); }
  .handle { margin-top: 12px; color: var(--muted); }
  .handle b { color: var(--text); font-weight: 600; }

  .bio {
    margin-top: 32px;
    padding: 20px 22px;
    border-left: 3px solid var(--accent);
    background: var(--bg-2);
    border-radius: 0 12px 12px 0;
  }
  .bio p + p { margin-top: 10px; }
  .bio .muted { color: var(--muted); font-size: 13px; }

  h2 {
    margin: 44px 0 14px;
    font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .14em;
    color: var(--muted);
  }

  .links { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; list-style: none; }
  .links > li { min-width: 0; }
  .link {
    display: flex; align-items: center; gap: 16px;
    width: 100%;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--bg-2);
    color: inherit; text-decoration: none;
    font: inherit; text-align: left; cursor: pointer;
    transition: transform .18s ease, border-color .18s ease, background .18s ease;
  }
  .link:hover, .link:focus-visible {
    transform: translateX(4px);
    border-color: var(--accent);
    outline: none;
  }
  .ico {
    flex: none;
    width: 42px; height: 42px; border-radius: 11px;
    display: grid; place-items: center;
    background: var(--bg); border: 1px solid var(--line);
    transition: background .18s ease, color .18s ease;
  }
  .ico svg { width: 20px; height: 20px; }
  .link:hover .ico, .link:focus-visible .ico { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .txt { flex: 1; min-width: 0; }
  .txt strong { display: block; font-weight: 600; }
  .txt small { display: block; color: var(--muted); font-size: 13px;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .arrow { flex: none; color: var(--muted); transition: color .18s ease, transform .18s ease; }
  .link:hover .arrow { color: var(--accent); transform: translate(2px, -2px); }

  footer { margin-top: 48px; color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  .toast {
    position: fixed; left: 50%; bottom: 24px;
    transform: translate(-50%, 20px);
    background: var(--accent); color: var(--accent-ink);
    padding: 10px 18px; border-radius: 999px;
    font-size: 13px; font-weight: 600;
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* плавное появление */
  .rise { opacity: 0; transform: translateY(12px); animation: rise .6s ease forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .rise, .dot { animation: none; opacity: 1; transform: none; }
  }
</style>
<script>

    try { saved = localStorage.getItem('theme'); } catch (e) {}

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  document.getElementById('y').textContent = new Date().getFullYear();
  const toast = document.getElementById('toast');
  let t;
  function show(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(t);
    t = setTimeout(() => toast.classList.remove('show'), 1800);
  }
  document.querySelectorAll('[data-copy]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const val = btn.dataset.copy;
      try {
        await navigator.clipboard.writeText(val);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = val; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (_) {}
        ta.remove();
      }
      show(btn.dataset.msg || 'Скопировано');
    });
  });
  // переключение темы
  const root = document.documentElement;
  const mq = window.matchMedia('(prefers-color-scheme: light)');
  function isDark() {
    const t = root.getAttribute('data-theme');
    return t ? t === 'dark' : !mq.matches;
  }
  function sync() { root.classList.toggle('is-dark', isDark()); }
  sync();
  mq.addEventListener && mq.addEventListener('change', sync);
  document.getElementById('themeBtn').addEventListener('click', () => {
    const next = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
    sync();
  });
</script>
